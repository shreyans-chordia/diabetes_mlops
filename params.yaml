data:
  path: data/diabetes.csv
  test_size: 0.2
  split_seed: 42
  use_imputation: false          # true = replace impossible zeros with train-set medians
  zero_invalid_columns:
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI

selection:
  metric: f1                     # accuracy | precision | recall | f1

export:
  model_dir: model

mlflow:
  experiment_name: diabetes-prediction

models:
  random_forest:
    n_estimators: 100
    max_depth: 5
    random_state: 42
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    random_state: 42
  logistic_regression:
    C: 1.0
    max_iter: 1000
    random_state: 42

cv:
  n_splits: 5
  seed: 42

tuning:
  enabled: true
  n_iter: 20            # random combinations tried per model
  inner_splits: 3       # folds used inside each search
  seed: 42
  search_spaces:
    random_forest:
      n_estimators: [100, 200, 300]
      max_depth: [3, 5, 8, 12, null]
      min_samples_leaf: [1, 2, 4, 8]
      max_features: [sqrt, 0.5, 1.0]
    gradient_boosting:
      n_estimators: [50, 100, 200]
      learning_rate: [0.01, 0.05, 0.1, 0.2]
      max_depth: [2, 3, 4]
      subsample: [0.7, 0.85, 1.0]
    logistic_regression:
      C: [0.01, 0.1, 1.0, 10.0, 100.0]
      class_weight: [null, balanced]

threshold:
  target_recall: 0.80   # the threshold search aims for at least this recall