data:
  path: data/diabetes.csv
  test_size: 0.2
  split_seed: 42
  use_imputation: false          # true = replace impossible zeros with train-set medians
  zero_invalid_columns:
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI

selection:
  metric: f1                     # accuracy | precision | recall | f1

export:
  model_dir: model

mlflow:
  experiment_name: diabetes-prediction

models:
  random_forest:
    n_estimators: 100
    max_depth: 5
    random_state: 42
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    random_state: 42