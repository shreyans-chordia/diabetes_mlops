schema: '2.0'
stages:
  train:
    cmd: python src/train.py
    deps:
    - path: data/diabetes.csv
      hash: md5
      md5: 994dc09d2fe9a1cf88d0f01622b8e9f3
      size: 24143
    - path: src/train.py
      hash: md5
      md5: 4eccfcca5f1bb7135d5fd4673482fa39
      size: 4743
    params:
      params.yaml:
        data:
          path: data/diabetes.csv
          test_size: 0.2
          split_seed: 42
          use_imputation: false
          zero_invalid_columns:
          - Glucose
          - BloodPressure
          - SkinThickness
          - Insulin
          - BMI
        export:
          model_dir: model
        mlflow:
          experiment_name: diabetes-prediction
        models:
          random_forest:
            n_estimators: 100
            max_depth: 5
            random_state: 42
          gradient_boosting:
            n_estimators: 100
            learning_rate: 0.1
            max_depth: 3
            random_state: 42
        selection:
          metric: f1
    outs:
    - path: metrics.json
      hash: md5
      md5: 7be5fe5a14e2cbdd804eb56cf1942160
      size: 493
    - path: model
      hash: md5
      md5: 2101593f4719cc5be3b31d84299e1247.dir
      size: 419003
      nfiles: 7
