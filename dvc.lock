schema: '2.0'
stages:
  train:
    cmd: python src/train.py
    deps:
    - path: data/diabetes.csv
      hash: md5
      md5: 994dc09d2fe9a1cf88d0f01622b8e9f3
      size: 24143
    - path: src/train.py
      hash: md5
      md5: 31d045a486a6e1edeccfc0afd25e8c30
      size: 7379
    params:
      params.yaml:
        cv:
          n_splits: 5
          seed: 42
        data:
          path: data/diabetes.csv
          test_size: 0.2
          split_seed: 42
          use_imputation: false
          zero_invalid_columns:
          - Glucose
          - BloodPressure
          - SkinThickness
          - Insulin
          - BMI
        export:
          model_dir: model
        mlflow:
          experiment_name: diabetes-prediction
        models:
          random_forest:
            n_estimators: 100
            max_depth: 5
            random_state: 42
          gradient_boosting:
            n_estimators: 100
            learning_rate: 0.1
            max_depth: 3
            random_state: 42
          logistic_regression:
            C: 1.0
            max_iter: 1000
            random_state: 42
        selection:
          metric: f1
    outs:
    - path: metrics.json
      hash: md5
      md5: d2d6c2b02eaed72c0572f7056641b893
      size: 1853
    - path: model
      hash: md5
      md5: 5fe0b76c5b842edaebfadaf49bd558eb.dir
      size: 139306
      nfiles: 7
