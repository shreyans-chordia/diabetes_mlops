schema: '2.0'
stages:
  train:
    cmd: python src/train.py
    deps:
    - path: data/diabetes.csv
      hash: md5
      md5: 994dc09d2fe9a1cf88d0f01622b8e9f3
      size: 24143
    - path: src/train.py
      hash: md5
      md5: c6fb57d60e7acabc8c3ddf38ae05e780
      size: 6947
    params:
      params.yaml:
        cv:
          n_splits: 5
          seed: 42
        data:
          path: data/diabetes.csv
          test_size: 0.2
          split_seed: 42
          use_imputation: false
          zero_invalid_columns:
          - Glucose
          - BloodPressure
          - SkinThickness
          - Insulin
          - BMI
        export:
          model_dir: model
        mlflow:
          experiment_name: diabetes-prediction
        models:
          random_forest:
            n_estimators: 100
            max_depth: 5
            random_state: 42
          gradient_boosting:
            n_estimators: 100
            learning_rate: 0.1
            max_depth: 3
            random_state: 42
        selection:
          metric: f1
    outs:
    - path: metrics.json
      hash: md5
      md5: 695c007ffa03a6fc321a500bb9575b2c
      size: 1413
    - path: model
      hash: md5
      md5: 6124b01789279fcb4cc5cd09cef74332.dir
      size: 139306
      nfiles: 7
